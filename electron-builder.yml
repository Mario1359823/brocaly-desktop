appId: de.brocaly.desktop
productName: Brocaly
copyright: © 2026 Mario Urbanek — AGPL-3.0-or-later
directories:
  output: release
  buildResources: build

files:
  - dist/main/**
  - dist/renderer/**
  - package.json
  - '!**/*.map'

extraResources:
  - from: resources/cases
    to: cases
    filter: ['**/*.json']

asar: true
npmRebuild: false

# Signiert das fertige macOS-Bundle ad hoc. Ohne das meldet macOS
# „Brocaly ist beschädigt" — Begründung steht im Script.
afterPack: scripts/adhoc-sign.mjs
afterAllArtifactBuild: scripts/notarize-dmg-artifacts.mjs

mac:
  # Die Version steht im Dateinamen, damit im Downloads-Ordner erkennbar bleibt,
  # welcher Stand da liegt. Die Download-Links auf brocaly.de lösen den echten
  # Dateinamen dafür über die Releases-API auf, statt ihn fest zu verdrahten.
  # Bei x64 setzt electron-builder den Arch-Teil nicht von selbst — deshalb
  # steht ${arch} hier explizit.
  artifactName: Brocaly-${version}-mac-${arch}.${ext}
  category: public.app-category.education
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: build/icon.png
  # Ohne hinterlegtes Zertifikat (CSC_LINK) gilt der Ad-hoc-Weg: electron-builder
  # signiert nicht, der afterPack-Hook uebernimmt, Hardened Runtime bleibt aus —
  # das ergibt nur mit notarisierter Signatur Sinn und blockiert sonst den Start.
  # Mit Zertifikat schaltet der Release-Workflow ueber --config-Ueberschreibungen
  # auf Developer-ID-Signatur, Hardened Runtime und Notarisierung um.
  # identity steht bewusst nicht hier: Ein fest verdrahtetes null wuerde auch
  # dann nicht signieren, wenn ein Zertifikat vorliegt. Der Workflow setzt es
  # im unsignierten Fall per --config.mac.identity=null.
  hardenedRuntime: false
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: >-
      Brocaly braucht dein Mikrofon, damit du im Prüfungsgespräch frei sprechen
      kannst. Die Aufnahme wird nur zur Transkription an den von dir gewählten
      KI-Anbieter gesendet und nicht gespeichert.
    LSMinimumSystemVersion: '11.0'

dmg:
  # Der Datenträgername muss je Architektur eindeutig sein: sonst hängen beim
  # Bauen zwei Volumes gleichen Namens unter /Volumes, macOS hängt das zweite
  # als „… 1" ein, und dmgbuild schreibt ins Leere („No such file or directory:
  # /Volumes/Brocaly 1.0.5/.background/background.tiff").
  title: Brocaly ${version}${arch}
  background: null
  contents:
    - x: 140
      y: 200
      type: file
    - x: 400
      y: 200
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch: [x64, arm64]
  icon: build/icon.png

nsis:
  # Ein Installer für x64 und arm64.
  artifactName: Brocaly-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Brocaly
  installerLanguages: [de_DE, en_US]

linux:
  target:
    - AppImage
  category: Education
  icon: build/icon.png
