appId: de.brocaly.desktop
productName: Brocaly
copyright: © 2026 Mario Urbanek — AGPL-3.0-or-later
directories:
  output: release
  buildResources: build

files:
  - dist/main/**
  - dist/renderer/**
  - package.json
  - '!**/*.map'

extraResources:
  - from: resources/cases
    to: cases
    filter: ['**/*.json']

asar: true
npmRebuild: false

# Signiert das fertige macOS-Bundle ad hoc. Ohne das meldet macOS
# „Brocaly ist beschädigt" — Begründung steht im Script.
afterPack: scripts/adhoc-sign.mjs

mac:
  # Ohne ${version} im Namen bleiben die „releases/latest/download"-URLs auf
  # brocaly.de über alle Releases hinweg gültig. Bei x64 setzt electron-builder
  # den Arch-Teil sonst nicht — deshalb steht ${arch} hier explizit.
  artifactName: Brocaly-mac-${arch}.${ext}
  category: public.app-category.education
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: build/icon.png
  # Ohne Developer-ID: electron-builder soll nicht signieren (das übernimmt der
  # afterPack-Hook ad hoc) und Hardened Runtime bleibt aus — das ergibt nur mit
  # notarisierter Signatur Sinn und blockiert sonst den Start.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    NSMicrophoneUsageDescription: >-
      Brocaly braucht dein Mikrofon, damit du im Prüfungsgespräch frei sprechen
      kannst. Die Aufnahme wird nur zur Transkription an den von dir gewählten
      KI-Anbieter gesendet und nicht gespeichert.
    LSMinimumSystemVersion: '11.0'

dmg:
  title: Brocaly ${version}
  contents:
    - x: 140
      y: 200
      type: file
    - x: 400
      y: 200
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch: [x64, arm64]
  icon: build/icon.png

nsis:
  # Ein Installer für x64 und arm64 — Name bewusst ohne Version, siehe mac.
  artifactName: Brocaly-Setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Brocaly
  installerLanguages: [de_DE, en_US]

linux:
  target:
    - AppImage
  category: Education
  icon: build/icon.png
