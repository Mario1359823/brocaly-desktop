name: Release Brocaly Desktop

# Tag a version to publish installers, e.g. `git tag v1.0.1 && git push --tags`.
# Das Tag-Schema ist `vX.Y.Z` — der Update-Check in electron/updates.ts schneidet
# genau ein fuehrendes `v` ab und kann mit anderen Praefixen nichts anfangen.
#
# Alternativ laesst sich der Workflow von Hand starten. Ohne `publish` baut er
# nur die Installer als Artefakte; mit `publish: true` legt er zusaetzlich das
# Tag `v<package.json-Version>` und das passende Release an.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Release aus der Version in package.json veroeffentlichen'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: dist:mac
          - os: windows-latest
            target: dist:win

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run ${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: brocaly-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.nsis.7z
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish
    steps:
      - uses: actions/checkout@v4

      # Beim Tag-Push ist der Name schon da; beim Handstart kommt er aus der
      # Version in package.json, damit App-Version und Tag nie auseinanderlaufen.
      - id: meta
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Brocaly Desktop ${{ steps.meta.outputs.tag }}
          files: artifacts/**/*
          generate_release_notes: true
