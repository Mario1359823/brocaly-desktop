name: Release Brocaly Desktop

# Tag a version to publish installers, e.g. `git tag v1.0.1 && git push --tags`.
# Das Tag-Schema ist `vX.Y.Z` — der Update-Check in electron/updates.ts schneidet
# genau ein fuehrendes `v` ab und kann mit anderen Praefixen nichts anfangen.
#
# Alternativ laesst sich der Workflow von Hand starten. Ohne `publish` baut er
# nur die Installer als Artefakte; mit `publish: true` legt er zusaetzlich das
# Tag `v<package.json-Version>` und das passende Release an.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Release aus der Version in package.json veroeffentlichen'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: dist:mac
          - os: windows-latest
            target: dist:win

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck

      # Die DMG-Erzeugung ist auf den macOS-Runnern unzuverlaessig, weil beide
      # Architekturen ein Volume gleichen Namens einhaengen (v1.0.3: "ln:
      # /Volumes/Brocaly 1.0.3/Applications: No such file or directory",
      # v1.0.5: fehlende background.tiff im selben Pfad). Der Name traegt
      # deshalb jetzt die Architektur; ein zweiter Versuch faengt den Rest ab.
      - name: Installer bauen
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_IS_PUBLISH: ${{ startsWith(github.ref, 'refs/tags/') || inputs.publish }}
          # Developer-ID-Zertifikat als base64-kodierte .p12 plus Passwort.
          # Wird erst im macOS-Zweig als CSC_LINK exportiert, damit Windows
          # nicht versucht, mit einem Apple-Zertifikat zu signieren.
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          # Notarisierung ueber Apple-ID und app-spezifisches Passwort.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -uo pipefail

          # Solange kein Zertifikat hinterlegt ist, bleibt es beim bisherigen
          # Ad-hoc-Weg fuer reine Testartefakte. Echte veroeffentlichte macOS-
          # Releases brechen ohne Developer-ID-Zertifikat unten bewusst ab.
          if [ "${{ runner.os }}" = "macOS" ] && [ -n "${MAC_CERT_P12:-}" ]; then
            echo "Developer-ID-Zertifikat gefunden — signiere und notarisiere."
            export CSC_LINK="$MAC_CERT_P12"
            export CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD"
            export CSC_IDENTITY_AUTO_DISCOVERY=true
            export CSC_NAME=159B621A7DF64585BD840442878C4682D7010092
            npm run check:mac-signing
            SIGN_ARGS="--config.mac.hardenedRuntime=true --config.mac.notarize=true"
          else
            if [ "${{ runner.os }}" = "macOS" ] && [ "$BUILD_IS_PUBLISH" = "true" ]; then
              echo "::error::Veroeffentlichte macOS-Releases brauchen ein Developer-ID-Zertifikat und Notarisierung."
              exit 1
            fi
            echo "::warning::Kein Zertifikat hinterlegt — Build bleibt ad-hoc signiert und ist nicht notarisiert."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            SIGN_ARGS="--config.mac.identity=null"
          fi

          # Windows kennt die mac-Ueberschreibungen nicht.
          if [ "${{ runner.os }}" != "macOS" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD CSC_NAME WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
            SIGN_ARGS=""
          fi

          build() { npm run ${{ matrix.target }} -- $SIGN_ARGS --publish=never; }
          build || {
            echo "::warning::Build fehlgeschlagen — zweiter Versuch."
            build
          }

      - uses: actions/upload-artifact@v4
        with:
          name: brocaly-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.nsis.7z
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || inputs.publish
    steps:
      - uses: actions/checkout@v4

      # Beim Tag-Push ist der Name schon da; beim Handstart kommt er aus der
      # Version in package.json, damit App-Version und Tag nie auseinanderlaufen.
      - id: meta
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Brocaly Desktop ${{ steps.meta.outputs.tag }}
          files: artifacts/**/*
          generate_release_notes: true
